<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10110f">
  <meta name="robots" content="noindex">
  <title>Enquiry received — FlowZenix</title>
  <link rel="icon" href="/logo-mark.png" type="image/png" sizes="256x256">
  <style>
    :root { color-scheme:dark; --bg:#10110f; --surface:#171916; --text:#f3f4ef; --muted:#b1b6aa; --line:#343830; --accent:#c7ef78; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.6; }
    main { width:min(100%,560px); padding:36px; border:1px solid var(--line); border-radius:10px; background:var(--surface); }
    .mark { display:grid; place-items:center; width:38px; height:38px; border-radius:9px; background:var(--accent); color:#171b10; font-weight:900; }
    h1 { margin:24px 0 8px; font-size:clamp(2rem,7vw,3rem); letter-spacing:-.05em; line-height:1.1; }
    p { color:var(--muted); }
    a { color:var(--accent); text-underline-offset:4px; }
    a:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
  </style>
</head>
<body><main><span class="mark" aria-hidden="true">F</span><h1>Thanks for getting in touch.</h1><p>Your enquiry was submitted. Thanks for sharing the details.</p><a href="/">Return to FlowZenix</a></main></body>
</html>
